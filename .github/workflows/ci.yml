# CI for the `core` resource on its own (the resources-level workflow at ../.github covers the npm workspace).
#
# It mirrors the offline half of scripts/check.sh. Not here: fxlint (local tooling, it needs the native
# database) and the three agent-browser suites (they need a Chromium and the agent-browser CLI) — those
# run locally with `scripts/check.sh --full`.
#
# The Postgres-backed Lua suites (DESIGN §56.10: db_tests, server_tests) reach the throwaway test database
# through the core_db resource's bridge (../core_db/tests/bridge.mjs). core_db is its own repository and is
# NOT checked out next to core in this repository's CI, so those suites run only when ../core_db exists (a
# workspace checkout); the postgres:16 service below is what they use then. scripts/check.sh always runs them.
name: core
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: core_test
          POSTGRES_PASSWORD: core_test
          POSTGRES_DB: core_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U core_test -d core_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # test-only credentials of a throwaway database (DESIGN §56.10.1) — not a secret
      CORE_TEST_PG_URL: postgres://core_test:core_test@127.0.0.1:5432/core_test
    steps:
      - uses: actions/checkout@v4
      - name: Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax
        run: find . -name '*.lua' -not -path './ui/*' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Offline tests
        run: |
          lua5.4 tests/run_tests.lua
          lua5.4 tests/client_chat_tests.lua
          lua5.4 tests/client_interiors_tests.lua
          lua5.4 tests/client_ui_tests.lua
      - name: Database-backed tests (only with ../core_db next to core, see the header)
        run: |
          if [ -d ../core_db ]; then
            lua5.4 tests/db_tests.lua
            lua5.4 tests/server_tests.lua
          else
            echo "skipped: ../core_db is not checked out here (its own repository); scripts/check.sh runs these suites"
          fi
      - name: UI build (no workspace lockfile inside this repo, so npm install)
        working-directory: ui
        run: npm install --no-audit --no-fund && npm run build
      # Everything below needs the dependencies the step above installed.
      - name: Unit tests (runtime + SDK, DESIGN §38.15)
        working-directory: ui
        run: |
          node --test ../ui/tests/chat-model.test.js
          node --test 'tests/unit/**/*.test.ts' 'sdk/tests/*.test.mjs'
      - name: Types
        working-directory: ui
        run: npx vue-tsc --noEmit -p tsconfig.json
      - name: Generated artefacts and plugin manifests
        run: |
          node ui/scripts/gen-kit-types.mjs --check
          node ui/scripts/check-plugins.mjs
